# No-op companion to ci.yml. Posts a green `test` status check for
# changes that ci.yml's paths-ignore filters out (docs, assets, images,
# sibling workflows). Required so branch protection on `main` is
# satisfied for doc-only / asset-only commits without running the full
# build+test pipeline.
#
# IMPORTANT: keep the `paths` list here in sync with `paths-ignore` in
# ci.yml. They must be exact complements: every file must match exactly
# one of the two filters, otherwise either both workflows fire (noisy
# but harmless) or neither fires (push blocked by branch protection).

name: CI (skip)

on:
  push:
    branches: [main]
    paths: &skip_paths
      - '*.md'
      - 'docs/**'
      - 'assets/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.ico'
      - '**/*.webp'
      - '.github/workflows/cla.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths: *skip_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: echo "No code changes — full CI not required."
